name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  # Lets the deploy workflow require this job before shipping anything.
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      # Runs the real firestore.rules against every write payload the app
      # makes. Must pass before the e2e suite, which also now runs under the
      # production ruleset — a rules regression should fail here, with a
      # precise message, rather than as an opaque PERMISSION_DENIED in a
      # browser test.
      - name: Rules tests (Firestore emulator)
        run: npm run test:rules:emulator

      - name: E2E tests (Firestore emulator, production ruleset)
        run: npm run test:e2e:emulator

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
