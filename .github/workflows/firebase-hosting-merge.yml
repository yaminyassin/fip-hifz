name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

jobs:
  # Nothing ships unless typecheck, lint, unit, rules, and e2e all pass.
  quality:
    uses: ./.github/workflows/ci.yml

  build_and_deploy:
    needs: quality
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci && npm run build

      # action-hosting-deploy below deploys HOSTING ONLY — it never touches
      # Firestore. Without this step the ruleset in firestore.rules is never
      # shipped, which is how the expired allow-all default survived in
      # production long enough to deny every client request.
      #
      # Rules go out BEFORE hosting: the new rules are backward-compatible
      # with the currently-deployed app, whereas a new app against the old
      # (expired, deny-everything) rules is not.
      #
      # Requires the service account to hold firebaserules.releases.create
      # and datastore.indexAdmin.
      - name: Deploy Firestore rules and indexes
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase-tools deploy \
            --only firestore:rules,firestore:indexes \
            --project fip-hifz \
            --non-interactive
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FIP_HIFZ }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FIP_HIFZ }}
          channelId: live
          projectId: fip-hifz
